name: Add reader source
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: write
concurrency:
  group: workreader-scan
  cancel-in-progress: false
jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'WorkReader: add source')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source validation and collectors
        run: python -m unittest discover -s tests -v
      - name: Apply the owner's source request
        id: source
        run: python scripts/add_source.py
      - name: Collect the requested feed
        env:
          SOURCE_ID: ${{ steps.source.outputs.source_id }}
        run: python scripts/collect.py --mode quick --only "$SOURCE_ID"
      - run: python scripts/build.py
      - run: node tests/test_reader.cjs
      - name: Save source and snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.json data/deals.json WorkReader.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Add requested public reader source'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: WorkReader-USB-reader
          path: WorkReader.html
          retention-days: 7
