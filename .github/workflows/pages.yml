name: Publish reader on GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Collect deal snapshots]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Stage public reader files
        run: |
          mkdir site
          cp index.html site/index.html
          cp WorkReader.html site/WorkReader.html
          cp -r data site/data
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
