name: Collect deal snapshots

on:
  push:
    branches: [main]
    paths:
      - 'config.json'
      - 'reader.template.html'
      - 'scripts/**'
      - 'styles/**'
      - 'assets/**'
      - 'tests/**'
      - 'requirements-browser.txt'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Quick feeds or full scan (includes rendered Jetstar/JB pages)
        type: choice
        default: full
        options: [quick, full]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: workreader-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose scan mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime, os
          now = datetime.datetime.now(datetime.timezone.utc)
          event = os.environ['EVENT_NAME']
          mode = os.environ.get('REQUESTED_MODE') if event=='workflow_dispatch' else ('full' if event=='push' or (now.hour % 4 == 0 and now.minute < 40) else 'quick')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('value=' + (mode or 'quick') + '\n')
          PY
      - name: Install browser collector
        if: steps.mode.outputs.value == 'full'
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Check parsers and snapshot preservation
        run: python -m unittest discover -s tests -v
      - name: Collect public data
        run: python scripts/collect.py --mode '${{ steps.mode.outputs.value }}'
      - name: Build portable reader
        run: python scripts/build.py
      - name: Check reader logic
        run: node tests/test_reader.cjs
      - name: Update repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/deals.json WorkReader.html index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update public deal snapshot'
            git pull --rebase origin main
            git push
          fi
      - name: Retain downloadable reader
        uses: actions/upload-artifact@v4
        with:
          name: WorkReader-USB-reader
          path: WorkReader.html
          retention-days: 7
      - name: Retain collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 3
