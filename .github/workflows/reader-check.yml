name: Check reader in Chromium
on:
  push:
    branches: [main]
    paths: ['reader.template.html', 'styles/**', 'assets/**', 'scripts/build.py', 'scripts/raindrop-client.js', 'scripts/cover-view.js', 'tests/**', '.github/workflows/reader-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build.py
      - run: node tests/test_reader.cjs
      - run: python tests/browser_reader.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-screenshots
          path: diagnostics/ui/
          retention-days: 7
